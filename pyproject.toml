[project]
name = "selenium-testing-library"
# CalVer: YYYY.N = the Nth release of the year (2026.1, 2026.2, ..., 2027.1). Bumped by scripts/release.py.
version = "2026.1"
description = "A Python Selenium library inspired by the Testing Library"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
  { name = "Anže Pečar", email = "anze@pecar.me" },
]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "selenium>3.0.0",
]

[project.urls]
Documentation = "https://github.com/anze3db/selenium-testing-library#readme"
Issues = "https://github.com/anze3db/selenium-testing-library/issues"
Source = "https://github.com/anze3db/selenium-testing-library"
Changelog = "https://github.com/anze3db/selenium-testing-library/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The package sits at the repository root (src/ holds the JavaScript that `npm run build`
# bundles into selenium_testing_library/main.js).
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--selenium-headless"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true

[tool.ruff]
target-version = "py311"

[tool.ruff.format]
# Shared with adventofcode, django-tui and potatoq, which format at 120 columns: keep them identical
exclude = ["scripts/release.py", "tests/test_release_script.py"]

[tool.ruff.lint]
select = [
  # Pyflakes
  "F",
  # Pycodestyle
  "E",
  "W",
  # isort
  "I",
  # Pyupgrade
  "UP",
  # Pylint
  "PL",
  # Ruff
  "RUF",
  # flake8
  "PT",
  "ARG",
  "YTT",
]
ignore = ["E501", "PLR2004", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
# The release script is shared with adventofcode, django-tui and potatoq: keep it in sync rather than lint-clean
"scripts/release.py" = ["PLR0917", "PLW2901"]
"tests/test_release_script.py" = ["ARG001", "ARG005", "PLC0415", "PT018"]
